[build-system]
requires = ['setuptools==82.0.1']
build-backend = 'setuptools.build_meta'

[project]
name = "nano-vllm"
version = "0.1.0"
description = "A small version vLLM projec for learning"
requires-python = ">=3.11,<3.12"
dependencies = [
    "transformers",
    "torch",
    "xxhash",
    "triton",
]

[tool.setuptools.packages.find]
where = ['src']